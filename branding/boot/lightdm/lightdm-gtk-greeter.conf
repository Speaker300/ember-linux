[greeter]
background=/usr/share/backgrounds/ember/ember-login-1920x1080.png
theme-name=Ember-Greeter
icon-theme-name=Ember
cursor-theme-name=Ember
cursor-theme-size=24
font-name=Inter 11
xft-antialias=true
xft-hintstyle=slight
xft-rgba=rgb
default-user-image=/usr/share/pixmaps/ember/ember-avatar.png
hide-user-image=false
round-user-image=true
panel-position=bottom
clock-format=%H:%M
indicators=~host;~spacer;~session;~clock;~spacer;~power
