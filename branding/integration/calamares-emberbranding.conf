---
# Ember Linux — Calamares shellprocess integration
#
# Place this file in the live ISO's /etc/calamares/modules/ and add the
# instance/page to /etc/calamares/settings.conf as described in MANIFEST.md.
#
# It runs OUTSIDE the target chroot and passes Calamares' ROOT to the pack.
# The pack must already be at /usr/share/ember/branding-pack in the live root.
dontChroot: true
timeout: 420
script:
  - "/usr/share/ember/branding-pack/install-into-chroot.sh --root ${ROOT} --live-user \"${USER}\" --quiet"
