---
# Desktop selection page. Uses packagechooser's "packages" method so the
# selected item's package list is handed to the Calamares packages module
# (Portage backend) later in the exec sequence.
mode: required
method: packages
default: openbox
labels:
  step: "Desktop"
items:
  - id: "openbox"
    name: "Openbox (recommended)"
    description: "Minimal, fast X11 desktop. The live session uses Openbox. Fully tested."
    packages:
      - x11-base/xorg-server
      - x11-drivers/xf86-input-libinput
      - x11-drivers/xf86-video-vesa
      - x11-drivers/xf86-video-qxl
      - x11-drivers/xf86-video-amdgpu
      - x11-drivers/xf86-video-intel
      - x11-drivers/xf86-video-nouveau
      - x11-wm/openbox
      - x11-terms/xterm
      - x11-misc/tint2
      - x11-misc/rofi
      - x11-misc/picom
      - x11-apps/xsetroot
      - x11-misc/lightdm
      - x11-misc/lightdm-gtk-greeter

  - id: "xfce"
    name: "Xfce"
    description: "Lightweight full desktop. Good balance of speed and features."
    packages:
      - x11-base/xorg-server
      - x11-drivers/xf86-input-libinput
      - x11-drivers/xf86-video-vesa
      - x11-drivers/xf86-video-qxl
      - x11-drivers/xf86-video-amdgpu
      - x11-drivers/xf86-video-intel
      - x11-drivers/xf86-video-nouveau
      - xfce-base/xfce4-meta
      - xfce-extra/xfce4-notifyd
      - x11-terms/xfce4-terminal
      - x11-misc/lightdm
      - x11-misc/lightdm-gtk-greeter

  - id: "kde"
    name: "KDE Plasma"
    description: "Full-featured Qt desktop. Large download; best with the desktop stage3."
    packages:
      - x11-base/xorg-server
      - x11-drivers/xf86-input-libinput
      - x11-drivers/xf86-video-vesa
      - x11-drivers/xf86-video-qxl
      - x11-drivers/xf86-video-amdgpu
      - x11-drivers/xf86-video-intel
      - x11-drivers/xf86-video-nouveau
      - kde-plasma/plasma-meta
      - kde-apps/dolphin
      - kde-apps/konsole
      - kde-apps/kate
      - x11-misc/lightdm
      - x11-misc/lightdm-gtk-greeter

  - id: "server"
    name: "Server (no desktop)"
    description: "No X11 desktop or display manager. Kernel, networking and CLI tools only."
    packages: []
