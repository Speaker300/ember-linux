---
dontChroot: false
timeout: 180
script:
  - "rc-update add dbus default || true"
  - "rc-update add elogind default || true"
  - "printf 'DISPLAYMANAGER=\"lightdm\"\\n' > /etc/conf.d/display-manager"
  - "rc-update add display-manager default || true"
  - "rc-update add NetworkManager default || true"
  - |
    mkdir -p /etc/xdg/openbox
    cat > /etc/xdg/openbox/autostart <<'EOF'
    tint2 &
    picom --backend xrender &
    xsetroot -solid '#2e3440' &
    EOF
  - |
    cat > /etc/xdg/openbox/menu.xml <<'EOF'
    <?xml version="1.0" encoding="UTF-8"?>
    <openbox_menu xmlns="http://openbox.org/3.4/menu">
      <menu id="root-menu" label="Openbox">
        <item label="Terminal"><action name="Execute"><command>xterm</command></action></item>
        <item label="Run..."><action name="Execute"><command>rofi -show run</command></action></item>
        <separator />
        <item label="Reconfigure"><action name="Reconfigure" /></item>
        <item label="Exit"><action name="Exit" /></item>
      </menu>
    </openbox_menu>
    EOF
