---
dontChroot: false
timeout: 240
script:
  - |
    set -u
    report=/var/log/ember-install-report.txt
    mkdir -p /var/log
    : > "$report"
    fail=0
    emit() { echo "$1" >> "$report"; }
    check() {
      desc=$1; shift
      if "$@" >>"$report" 2>&1; then
        emit "PASS: $desc"
      else
        emit "FAIL: $desc"
        fail=$((fail+1))
      fi
    }
    emit "Ember Linux installation report"
    emit "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
    emit "kernel: $(ls /boot/vmlinuz-* 2>/dev/null | head -1)"
    emit ""
    if ls /boot/vmlinuz-* >/dev/null 2>&1; then emit "PASS: kernel image present"; else emit "FAIL: no kernel image"; fail=$((fail+1)); fi
    if [ -s /boot/grub/grub.cfg ] && grep -q menuentry /boot/grub/grub.cfg; then emit "PASS: GRUB configuration present"; else emit "FAIL: GRUB configuration missing"; fail=$((fail+1)); fi
    if grep -qE '^[^#].*[[:space:]]/[[:space:]]' /etc/fstab; then emit "PASS: root filesystem in fstab"; else emit "FAIL: root filesystem missing from fstab"; fail=$((fail+1)); fi
    if [ -s /etc/machine-id ]; then emit "PASS: machine-id set"; else emit "FAIL: machine-id empty"; fail=$((fail+1)); fi
    ember_user=$(awk -F: '$3 >= 1000 && $3 < 65534 {print $1; exit}' /etc/passwd)
    if [ -n "$ember_user" ] && [ -d "/home/$ember_user" ]; then
      emit "PASS: user home present ($ember_user)"
    else
      emit "FAIL: user home missing"; fail=$((fail+1))
    fi
    if [ -f /etc/conf.d/display-manager ] && grep -q '^DISPLAYMANAGER=' /etc/conf.d/display-manager; then
      if [ -e /etc/runlevels/default/display-manager ]; then emit "PASS: display manager enabled"; else emit "FAIL: display manager not in default runlevel"; fail=$((fail+1)); fi
    else
      emit "INFO: no display manager configured (server install)"
    fi
    if [ -d /etc/xdg/openbox ] && [ -s /etc/xdg/openbox/autostart ]; then emit "PASS: Openbox autostart installed"; fi
    if [ -f /etc/portage/make.conf ] && grep -q MAKEOPTS /etc/portage/make.conf; then emit "PASS: make.conf written"; else emit "FAIL: make.conf missing MAKEOPTS"; fail=$((fail+1)); fi
    if [ -f /etc/portage/secureboot.key ]; then
      emit "INFO: Secure Boot key present"
      if /usr/local/sbin/ember-secureboot status >>"$report" 2>&1; then emit "PASS: Secure Boot signatures verified"; else emit "FAIL: Secure Boot signature verification"; fail=$((fail+1)); fi
    fi
    emit ""
    emit "block devices:"
    lsblk -o NAME,SIZE,FSTYPE,MOUNTPOINT >>"$report" 2>&1 || true
    if [ -d /sys/firmware/efi ]; then
      emit ""
      emit "EFI boot entries:"
      efibootmgr -v >>"$report" 2>&1 || true
    fi
    emit ""
    if [ "$fail" -gt 0 ]; then
      emit "RESULT: $fail critical check(s) failed"
      echo "Ember post-install verification failed; see /var/log/ember-install-report.txt" >&2
      exit 1
    fi

    # QEMU test guests get key-only root SSH so the harness can verify the
    # installed desktop.  Real hardware never reports the EMBERTEST serial.
    if [ "$(cat /sys/class/dmi/id/product_serial 2>/dev/null || true)" = "EMBERTEST" ]; then
      mkdir -p /root/.ssh
      chmod 700 /root/.ssh
      cat > /root/.ssh/authorized_keys <<'KEYEOF'
    ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICrWQVY2V1F0shziHrNQKRlZtShhqjgtdAsfL0QlLmEs ember-test
    KEYEOF
      chmod 600 /root/.ssh/authorized_keys
      if [ -d /run/systemd/system ] || [ -e /usr/lib/systemd/systemd ]; then
        cat > /etc/systemd/system/ember-test-ssh.service <<'UNITEOF'
    [Unit]
    Description=Ember test SSH
    After=network.target
    [Service]
    ExecStart=/usr/sbin/sshd -D -o PermitRootLogin=prohibit-password -o PasswordAuthentication=no
    Restart=always
    [Install]
    WantedBy=multi-user.target
    UNITEOF
        mkdir -p /etc/systemd/system/multi-user.target.wants
        ln -sf /etc/systemd/system/ember-test-ssh.service \
          /etc/systemd/system/multi-user.target.wants/ember-test-ssh.service
      else
        cat > /etc/local.d/ember-test-ssh.start <<'SSHEOF'
    #!/bin/sh
    /usr/sbin/sshd -o PermitRootLogin=prohibit-password -o PasswordAuthentication=no || true
    SSHEOF
        chmod +x /etc/local.d/ember-test-ssh.start
        rc-update add local default 2>/dev/null || true
      fi
      emit "INFO: QEMU test SSH enabled"
    fi

    emit "RESULT: all critical checks passed"
    exit 0
