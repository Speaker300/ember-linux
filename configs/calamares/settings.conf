# Ember Gentoo installer - MVP live ISO configuration
---
modules-search: [ local ]

instances:
- id: stage3guide
  module: notesqml
  config: stage3guide.conf
- id: desktopchoose
  module: packagechooser
  config: desktopchoose.conf
- id: prep
  module: shellprocess
  config: prep.conf
- id: openrc
  module: shellprocess
  config: openrc.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - notesqml@stage3guide
  - stagechoose
  - packagechooser@desktopchoose
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - downloadstage3
  - shellprocess@prep
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - gentoopkg
  - packages
  - users
  - displaymanager
  - hwclock
  - shellprocess@openrc
  - dracut_gentoo
  - grubcfg
  - bootloader
  - umount
- show:
  - finished

branding: default
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
