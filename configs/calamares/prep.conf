---
dontChroot: false
timeout: 120
script:
  - "echo 'FEATURES=\"getbinpkg\"' >> /etc/portage/make.conf"
  - "echo 'EMERGE_DEFAULT_OPTS=\"--getbinpkg --jobs=4 --load-average=24\"' >> /etc/portage/make.conf"
  - "echo 'ACCEPT_LICENSE=\"*\"' >> /etc/portage/make.conf"
  - "echo 'GRUB_PLATFORMS=\"efi-64 pc\"' >> /etc/portage/make.conf"
  - "mkdir -p /etc/portage/binrepos.conf"
  - "mkdir -p /var/cache/binhost/gentoo"
  - "mkdir -p /var/lib/dbus"
  - "mkdir -p /etc/sudoers.d"
  - "[ -s /etc/machine-id ] || (cat /proc/sys/kernel/random/uuid | tr -d '-' > /etc/machine-id)"
  - "[ -s /var/lib/dbus/machine-id ] || cp /etc/machine-id /var/lib/dbus/machine-id"
