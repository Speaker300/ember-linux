# Ember Linux base package selection.
# Desktop packages come from packagechooser (desktopchoose.conf) and are
# installed by the gentoopkg module in the same transaction.
---
skip_unavailable: false
skip_if_no_internet: false
update_db: false
sync_method: none
update_system: false
gentoo_world_update: false
accept_keywords: []
package_use:
  sys-kernel/installkernel: dracut grub
  sys-boot/grub: mount
operations:
- install:
  - sys-kernel/gentoo-kernel-bin
  - sys-kernel/installkernel
  - sys-kernel/dracut
  - sys-boot/plymouth
  - sys-boot/grub
  - sys-boot/efibootmgr
  - net-misc/networkmanager
  - net-wireless/wpa_supplicant
  - sys-kernel/linux-firmware
  - sys-firmware/intel-microcode
  - app-admin/sudo
  - sys-apps/dbus
  - sys-auth/polkit
  - sys-fs/dosfstools
  - sys-fs/e2fsprogs
  - sys-fs/btrfs-progs
  - sys-fs/xfsprogs
  - sys-fs/f2fs-tools
  - sys-fs/lvm2
  - sys-fs/cryptsetup
  - sys-apps/gptfdisk
  - sys-apps/pciutils
  - sys-apps/usbutils
  - app-portage/cpuid2cpuflags
  - app-portage/gentoolkit
  - app-portage/eix
  - app-portage/portage-utils
  - app-admin/eselect
  - app-admin/eclean-kernel
  - app-eselect/eselect-repository
  - dev-vcs/git
  - net-misc/rsync
  - sys-boot/os-prober
  - app-editors/nano
  - sys-apps/less
  - net-misc/openssh
  - media-fonts/dejavu
  - media-fonts/liberation-fonts
  - net-misc/dhcpcd
